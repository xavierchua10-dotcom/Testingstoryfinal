<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Pixel Rush — Final Story</title>
<link rel="manifest" href="manifest-story4.json">
<meta name="theme-color" content="#a855f7">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#f4f4f4;
    --dim:#9fa8c9;
    --yellow:#ffce54;
    --red:#e4423f;
    --blue:#3ca7e0;
    --black:#101018;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{
    margin:0; padding:0; width:100%; height:100%;
    background:#000; overflow:hidden;
    overscroll-behavior:none; touch-action:none;
    font-family:'VT323', monospace; color:var(--ink);
    display:flex; align-items:center; justify-content:center;
  }
  #gameWrapper{
    position:relative; height:100%;
    width:100%;
  }
  canvas{
    position:absolute; inset:0; display:block;
    image-rendering:pixelated; image-rendering:crisp-edges; image-rendering:-moz-crisp-edges;
  }
  .scanlines{
    position:absolute; inset:0; pointer-events:none; z-index:5;
    background:repeating-linear-gradient(rgba(0,0,0,0) 0px, rgba(0,0,0,0) 1px, rgba(0,0,0,0.14) 2px, rgba(0,0,0,0.14) 3px);
    mix-blend-mode:multiply;
  }
  .vignette{
    position:absolute; inset:0; pointer-events:none; z-index:4;
    background:radial-gradient(ellipse at center, rgba(0,0,0,0) 55%, rgba(0,0,0,0.4) 100%);
  }

  .ui-layer{ position:absolute; inset:0; pointer-events:none; z-index:6; }
  .hud{ position:absolute; top:0; left:0; right:0; display:flex; justify-content:space-between; align-items:flex-start;
        padding: max(14px, env(safe-area-inset-top)) 14px 0; opacity:0; transition:opacity .3s; }
  .hud.show{ opacity:1; }
  .score-label{ font-family:'Press Start 2P', monospace; font-size:9px; color:var(--dim); letter-spacing:1px; }
  .hearts{ display:flex; gap:5px; margin-top:5px; }
  .heart{ font-family:'Press Start 2P', monospace; font-size:17px; color:var(--red); text-shadow:2px 2px 0 #000; }
  .heart.lost{ color:#333; opacity:0.4; }
  .mute-btn{
    pointer-events:auto; margin-top:8px; width:34px; height:34px;
    background:var(--black); border:2px solid var(--yellow);
    color:var(--ink); font-size:14px; display:flex; align-items:center; justify-content:center; cursor:pointer;
    box-shadow:3px 3px 0 #000;
  }
  .mute-btn:active{ transform:translate(2px,2px); box-shadow:1px 1px 0 #000; }
  .powerups{
    position:absolute; top:54px; left:0; right:0; display:flex; justify-content:center; gap:6px;
    opacity:0; transition:opacity .3s;
  }
  .powerups.show{ opacity:1; }
  .pu-badge{
    font-family:'VT323', monospace; font-size:13px; padding:2px 7px; border:2px solid #1a1a2e;
    box-shadow:2px 2px 0 #000; color:#1a1a2e;
  }
  .pu-shield{ background:var(--blue); color:#fff; }

  .boss-bar{
    position:absolute; top:90px; left:50%; transform:translateX(-50%);
    width:74%; max-width:340px; text-align:center; opacity:0; transition:opacity .3s; pointer-events:none;
  }
  .boss-bar.show{ opacity:1; }
  .boss-label{ font-family:'Press Start 2P', monospace; font-size:11px; color:var(--red); text-shadow:2px 2px 0 #000; margin-bottom:5px; }
  .boss-track{ height:14px; border:2px solid #1a1a2e; background:#1a1a2e; box-shadow:2px 2px 0 #000; }
  .boss-fill{ height:100%; width:100%; background:var(--red); transition:width .3s ease-out; }

  .panel{
    position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; padding:24px; pointer-events:none; opacity:0; transition:opacity .4s;
  }
  .panel.show{ opacity:1; pointer-events:auto; }
  .panel.side-left{ align-items:flex-start; text-align:left; }
  .panel.side-right{ align-items:flex-end; text-align:right; }
  .title{
    font-family:'Press Start 2P', monospace; font-size:clamp(20px,7vw,34px); line-height:1.5;
    color:var(--yellow); margin:0 0 14px; text-shadow:3px 3px 0 #000, -1px -1px 0 #b5271f;
  }
  .subtitle{ font-family:'VT323', monospace; font-size:20px; letter-spacing:1px; color:var(--dim); margin-bottom:30px; }
  .prologue{
    font-family:'VT323', monospace; font-size:17px; line-height:1.35; letter-spacing:0.5px;
    color:var(--dim); max-width:280px; margin:-16px 0 26px; font-style:italic; opacity:0.85;
  }
  .controls-row{ display:flex; gap:20px; margin-bottom:34px; flex-wrap:wrap; justify-content:center; }
  .control-chip{ display:flex; flex-direction:column; align-items:center; gap:8px; font-family:'VT323', monospace; font-size:15px; color:var(--dim); letter-spacing:1px; }
  .control-chip .glyph{
    width:42px; height:42px; background:var(--black); border:2px solid var(--blue);
    display:flex; align-items:center; justify-content:center;
    font-size:20px; color:var(--blue); font-family:Arial, sans-serif;
    box-shadow:3px 3px 0 #000;
  }
  .btn{
    font-family:'Press Start 2P', monospace; font-size:14px; letter-spacing:1px;
    padding:16px 28px; border:3px solid #1a1a2e; cursor:pointer;
    background:var(--red); color:#fff; box-shadow:4px 4px 0 #1a1a2e;
  }
  .btn:active{ transform:translate(3px,3px); box-shadow:1px 1px 0 #1a1a2e; }
  .hint{ position:absolute; bottom:max(20px, env(safe-area-inset-bottom)); left:0; right:0; text-align:center;
         font-family:'VT323', monospace; font-size:16px; color:var(--dim); letter-spacing:1px; opacity:0; transition:opacity .4s; }
  .hint.show{ opacity:0.9; }

  .intro-portrait-wrap{
    width:150px; height:150px; margin-bottom:16px;
    border:3px solid var(--yellow); box-shadow:4px 4px 0 #000;
    overflow:hidden; background:#000; flex-shrink:0;
  }
  .intro-portrait{ width:100%; height:100%; object-fit:cover; object-position:50% 15%; display:block; }

  @keyframes portraitFlash{
    0%{ filter:brightness(4) saturate(0.3); }
    100%{ filter:brightness(1) saturate(1); }
  }
  .portrait-flash-anim{ animation:portraitFlash 0.35s ease-out; }

  .speech-bubble{
    position:relative; max-width:270px; background:var(--black);
    border:3px solid var(--ink); box-shadow:4px 4px 0 #000;
    padding:16px 18px; margin:12px 0 28px;
  }
  .speech-bubble:before{
    content:''; position:absolute; left:50%; top:-11px; transform:translateX(-50%);
    border-left:10px solid transparent; border-right:10px solid transparent; border-bottom:12px solid var(--ink);
  }
  .speech-text{
    font-family:'VT323', monospace; font-size:20px; line-height:1.3; color:var(--ink);
  }
  .tap-continue{
    font-family:'VT323', monospace; font-size:14px; letter-spacing:2px; color:var(--dim);
    animation:blink 1.4s steps(1) infinite; text-transform:uppercase;
  }
  @keyframes blink{ 0%,49%{ opacity:1; } 50%,100%{ opacity:0.25; } }

  .countdown-overlay{
    position:absolute; inset:0; z-index:8; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:28px;
    opacity:0; pointer-events:none; transition:opacity .2s;
  }
  .countdown-overlay.show{ opacity:1; }
  .countdown-number{
    font-family:'Press Start 2P', monospace; font-size:clamp(48px,16vw,84px); color:var(--yellow);
    text-shadow:4px 4px 0 #000, -2px -2px 0 #b5271f;
  }

  .tap-play-overlay{
    position:absolute; inset:0; z-index:9; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:18px;
    background:rgba(0,0,0,0.55); cursor:pointer; pointer-events:auto;
    opacity:1; transition:opacity .25s;
  }
  .tap-play-overlay.hide{ opacity:0; }
  .tap-play-title{
    font-family:'Press Start 2P', monospace; font-size:clamp(20px,6vw,32px); color:var(--yellow);
    text-shadow:4px 4px 0 #000, -2px -2px 0 #b5271f; text-align:center; letter-spacing:2px;
  }
  .tap-play-hint{
    font-family:'VT323', monospace; font-size:18px; letter-spacing:3px; color:var(--dim);
    animation:blink 1.4s steps(1) infinite; text-transform:uppercase;
  }

  .mini-bubble{
    position:absolute; top:50%; z-index:7;
    display:flex; flex-direction:column; align-items:center; text-align:center;
    width:min(68vw, 260px);
    opacity:0; pointer-events:none; transition:opacity .3s, transform .3s;
    transform:translateY(-46%);
  }
  .mini-bubble.show{ opacity:1; transform:translateY(-50%); }
  .mini-bubble.side-left{ left:14px; }
  .mini-bubble.side-right{ right:14px; }
  .mini-portrait{
    width:120px; height:120px; object-fit:cover; object-position:50% 15%;
    border:3px solid var(--yellow); box-shadow:4px 4px 0 #000; background:#000; margin-bottom:14px;
  }
  .mini-speech{
    position:relative; background:var(--black); border:3px solid var(--ink); box-shadow:4px 4px 0 #000;
    padding:14px 16px; max-width:100%;
  }
  .mini-speech .speech-text{ font-size:19px; }
  .mini-speech:before{
    content:''; position:absolute; left:50%; top:-11px; transform:translateX(-50%);
    border-left:9px solid transparent; border-right:9px solid transparent; border-bottom:11px solid var(--ink);
  }

  .intro-portrait-wrap.villain-frame{ border-color:var(--red); border-width:5px; box-shadow:5px 5px 0 #000; }
  .speech-bubble.villain-frame{ border-color:var(--red); border-width:4px; }
  .speech-bubble.villain-frame:before{ border-bottom-color:var(--red); }
  .mini-portrait.villain-frame{ border-color:var(--red); border-width:4px; }
  .mini-speech.villain-frame{ border-color:var(--red); border-width:4px; }
  .mini-speech.villain-frame:before{ border-bottom-color:var(--red); }
</style>
</head>
<body>

<div id="gameWrapper">
<canvas id="game"></canvas>
<div class="vignette"></div>
<div class="scanlines"></div>

<div class="ui-layer">
  <div class="hud" id="hud">
    <div>
      <div class="score-label">LIVES</div>
      <div class="hearts" id="heartsRow"></div>
    </div>
    <div style="display:flex; flex-direction:column; align-items:flex-end; gap:6px;">
      <button class="mute-btn" id="muteBtn">🔊</button>
      <button class="mute-btn" id="pauseBtn">⏸</button>
    </div>
  </div>
  <div class="powerups" id="powerupBar"></div>
  <div class="boss-bar" id="bossBar">
    <div class="boss-label" id="bossLabel">BOSS</div>
    <div class="boss-track"><div class="boss-fill" id="bossFill"></div></div>
  </div>

  <div class="panel" id="introPanel">
    <div class="intro-portrait-wrap" id="introPortraitWrap">
      <img class="intro-portrait" id="introPortrait" src="savior-1.jpg" alt="Savior">
    </div>
    <div class="speech-bubble" id="introSpeechBubble">
      <div class="speech-text" id="introText"></div>
    </div>
    <div class="tap-continue">TAP TO CONTINUE</div>
  </div>

  <div class="panel" id="cutscenePanel">
    <div class="intro-portrait-wrap" id="cutscenePortraitWrap">
      <img class="intro-portrait" id="cutscenePortrait" src="savior-1.jpg" alt="">
    </div>
    <div class="speech-bubble" id="cutsceneSpeechBubble">
      <div class="speech-text" id="cutsceneText"></div>
    </div>
    <div class="tap-continue">TAP TO CONTINUE</div>
  </div>

  <div class="tap-play-overlay" id="tapPlayOverlay">
    <div class="tap-play-title">PIXEL RUSH</div>
    <div class="tap-play-hint">TAP TO PLAY</div>
  </div>

  <div class="countdown-overlay" id="countdownOverlay">
    <div class="countdown-number" id="countdownNumber">3</div>
    <div class="controls-row" id="countdownControls">
      <div class="control-chip"><div class="glyph">⇆</div>SWITCH LANE</div>
      <div class="control-chip"><div class="glyph">⇡</div>JUMP</div>
      <div class="control-chip"><div class="glyph">⇣</div>SLIDE</div>
    </div>
  </div>

  <div class="mini-bubble" id="miniBubble">
    <img class="mini-portrait" id="miniPortrait" src="savior-1.jpg" alt="Savior">
    <div class="mini-speech" id="miniSpeechBubble"><div class="speech-text" id="miniText"></div></div>
  </div>

    <div class="panel" id="pausePanel">
    <div class="title" style="font-size:clamp(20px,7vw,30px);">PAUSED</div>
    <button class="btn" id="resumeBtn">RESUME</button>
    <button class="btn" id="pauseMenuBtn" style="margin-top:14px; background:var(--black); border-color:var(--yellow); color:var(--yellow);">MAIN MENU</button>
  </div>

<div class="panel" id="overPanel">
    <div class="title" style="font-size:clamp(18px,6vw,26px); color:var(--red); text-shadow:3px 3px 0 #000;">GAME OVER</div>
    <button class="btn" id="retryBtn">RUN AGAIN</button>
    <button class="btn" id="menuBtn" style="margin-top:14px; background:var(--black); border-color:var(--yellow); color:var(--yellow);">MAIN MENU</button>
  </div>

  <div class="panel" id="victoryPanel">
    <div class="title" style="color:var(--yellow); text-shadow:3px 3px 0 #000, -1px -1px 0 #b5271f;">THE END</div>
    <div class="subtitle" style="margin-bottom:10px;"></div>
    <button class="btn" id="victoryRetryBtn">RUN AGAIN</button>
    <button class="btn" id="victoryMenuBtn" style="margin-top:14px; background:var(--black); border-color:var(--yellow); color:var(--yellow);">MAIN MENU</button>
  </div>

  <div class="hint" id="hint">swipe or use arrow keys</div>
</div>
</div>

<script>
(function(){
  "use strict";

  // ---------- Low-res canvas setup ----------
  var canvas = document.getElementById('game');
  var ctx = canvas.getContext('2d');
  var gameWrapper = document.getElementById('gameWrapper');
  var iW = 0, iH = 0;
  var INTERNAL_H = 300;

  function resize(){
    var cssW = gameWrapper.clientWidth, cssH = gameWrapper.clientHeight;
    var pixelScale = cssH / INTERNAL_H;
    iH = INTERNAL_H;
    iW = Math.round(cssW / pixelScale);
    canvas.width = iW;
    canvas.height = iH;
    canvas.style.width = cssW + 'px';
    canvas.style.height = cssH + 'px';
    ctx.imageSmoothingEnabled = false;
  }
  window.addEventListener('resize', resize);
  resize();

  // ---------- DOM refs ----------
  var hud = document.getElementById('hud');
  var heartsRow = document.getElementById('heartsRow');
  var introPanel = document.getElementById('introPanel');
  var introPortrait = document.getElementById('introPortrait');
  var introPortraitWrap = document.getElementById('introPortraitWrap');
  var introSpeechBubble = document.getElementById('introSpeechBubble');
  var introText = document.getElementById('introText');
  var cutscenePanel = document.getElementById('cutscenePanel');
  var cutscenePortrait = document.getElementById('cutscenePortrait');
  var cutscenePortraitWrap = document.getElementById('cutscenePortraitWrap');
  var cutsceneSpeechBubble = document.getElementById('cutsceneSpeechBubble');
  var cutsceneText = document.getElementById('cutsceneText');
  var countdownOverlay = document.getElementById('countdownOverlay');
  var countdownNumber = document.getElementById('countdownNumber');
  var tapPlayOverlay = document.getElementById('tapPlayOverlay');
  var miniBubble = document.getElementById('miniBubble');
  var miniPortrait = document.getElementById('miniPortrait');
  var miniSpeechBubble = document.getElementById('miniSpeechBubble');
  var miniText = document.getElementById('miniText');
  var overPanel = document.getElementById('overPanel');
  var victoryPanel = document.getElementById('victoryPanel');
  var victoryRetryBtn = document.getElementById('victoryRetryBtn');
  var victoryMenuBtn = document.getElementById('victoryMenuBtn');
  var retryBtn = document.getElementById('retryBtn');
  var menuBtn = document.getElementById('menuBtn');
  var muteBtn = document.getElementById('muteBtn');
  var pauseBtn = document.getElementById('pauseBtn');
  var pausePanel = document.getElementById('pausePanel');
  var resumeBtn = document.getElementById('resumeBtn');
  var pauseMenuBtn = document.getElementById('pauseMenuBtn');
  var hint = document.getElementById('hint');
  var powerupBar = document.getElementById('powerupBar');
  var bossBar = document.getElementById('bossBar');
  var bossFill = document.getElementById('bossFill');
  var bossLabel = document.getElementById('bossLabel');

  // ---------- Audio (chiptune-style) ----------
  var audioCtx = null;
  var muted = false;
  var beatTimer = null;
  var paused = false;

  try{
    if(localStorage.getItem('pixelrush-muted') === 'true'){ muted = true; }
  }catch(e){}

  function ensureAudio(){
    if(!audioCtx){
      try{ audioCtx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ return; }
    }
    if(audioCtx.state === 'suspended') audioCtx.resume();
  }

  function tone(freq,duration,type,gainVal,when,glideTo){
    if(muted || !audioCtx) return;
    var t = audioCtx.currentTime + (when||0);
    var osc = audioCtx.createOscillator();
    var gain = audioCtx.createGain();
    osc.type = type||'square';
    osc.frequency.setValueAtTime(freq, t);
    if(glideTo) osc.frequency.linearRampToValueAtTime(glideTo, t+duration);
    gain.gain.setValueAtTime(gainVal||0.2, t);
    gain.gain.exponentialRampToValueAtTime(0.001, t+duration);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start(t); osc.stop(t+duration+0.05);
  }

  function noiseHit(duration,gainVal,when,filterFreq){
    if(muted || !audioCtx) return;
    var t = audioCtx.currentTime + (when||0);
    var bufferSize = Math.max(1, Math.floor(audioCtx.sampleRate*duration));
    var buffer = audioCtx.createBuffer(1,bufferSize,audioCtx.sampleRate);
    var data = buffer.getChannelData(0);
    for(var i=0;i<bufferSize;i++) data[i] = Math.random()*2-1;
    var src = audioCtx.createBufferSource(); src.buffer = buffer;
    var filt = audioCtx.createBiquadFilter(); filt.type='highpass'; filt.frequency.value = filterFreq||4000;
    var gain = audioCtx.createGain();
    gain.gain.setValueAtTime(gainVal||0.15, t);
    gain.gain.exponentialRampToValueAtTime(0.001, t+duration);
    src.connect(filt).connect(gain).connect(audioCtx.destination);
    src.start(t);
  }

  function playJump(){ tone(220,0.14,'square',0.15,0,660); }
  function playCrash(){ noiseHit(0.3,0.4,0,700); tone(80,0.35,'square',0.26,0,30); }
  function playHurt(){ noiseHit(0.16,0.3,0,900); tone(140,0.2,'square',0.22,0,70); }
  function playPowerup(){ tone(660,0.08,'square',0.18,0); tone(880,0.08,'square',0.16,0.06); tone(1100,0.10,'square',0.14,0.12); }
  function playShieldBreak(){ noiseHit(0.2,0.3,0,600); tone(150,0.2,'square',0.28,0,50); }
  function playBossStart(){ tone(90,0.35,'sawtooth',0.3,0,42); noiseHit(0.3,0.3,0.08,500); }
  function playBossDefeat(){
    tone(440,0.12,'square',0.2,0); tone(554,0.12,'square',0.18,0.12);
    tone(659,0.14,'square',0.18,0.24); tone(880,0.24,'square',0.22,0.36);
  }
  function playTransform(){
    noiseHit(0.5,0.35,0,300);
    tone(60,0.6,'sawtooth',0.32,0,20);
    tone(220,0.25,'square',0.2,0.15,700);
    tone(150,0.3,'sawtooth',0.22,0.3,30);
  }
  function playRage(){
    noiseHit(0.35,0.32,0,400);
    tone(90,0.4,'sawtooth',0.3,0,35);
    tone(280,0.16,'square',0.22,0.12,900);
  }
  function playLunge(){
    noiseHit(0.22,0.32,0,500);
    tone(180,0.18,'sawtooth',0.26,0,40);
  }
  function playGrenadeBlast(){
    noiseHit(0.4,0.4,0,350);
    tone(70,0.35,'sawtooth',0.32,0,25);
    tone(140,0.1,'square',0.18,0.02,60);
  }
  function playPlasmaFire(){
    tone(1200,0.14,'sawtooth',0.22,0,300);
    noiseHit(0.1,0.2,0,3000);
  }
  function playThunder(){ noiseHit(0.45,0.22,0,260); }
  function playVictory(){
    tone(523.25,0.3,'square',0.2,0);
    tone(659.25,0.3,'square',0.18,0.15);
    tone(783.99,0.3,'square',0.18,0.3);
    tone(1046.50,0.5,'square',0.22,0.45);
  }

  // ---- soundtrack: kick / 808 bass / pad chords / claps / hats ----
  function playKick(hard){
    if(muted || !audioCtx) return;
    var t = audioCtx.currentTime;
    var osc = audioCtx.createOscillator();
    var gain = audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(150, t);
    osc.frequency.exponentialRampToValueAtTime(45, t+0.09);
    gain.gain.setValueAtTime(hard ? 0.42 : 0.35, t);
    gain.gain.exponentialRampToValueAtTime(0.001, t+0.22);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start(t); osc.stop(t+0.25);
    if(hard){
      var osc2 = audioCtx.createOscillator();
      var gain2 = audioCtx.createGain();
      osc2.type = 'sine';
      osc2.frequency.setValueAtTime(65, t);
      osc2.frequency.exponentialRampToValueAtTime(32, t+0.16);
      gain2.gain.setValueAtTime(0.22, t);
      gain2.gain.exponentialRampToValueAtTime(0.001, t+0.32);
      osc2.connect(gain2).connect(audioCtx.destination);
      osc2.start(t); osc2.stop(t+0.34);
    }
  }

  function playBass808(freq, duration, gainVal, waveType){
    if(muted || !audioCtx) return;
    var t = audioCtx.currentTime;
    var osc = audioCtx.createOscillator();
    var gain = audioCtx.createGain();
    osc.type = waveType||'sine';
    osc.frequency.setValueAtTime(freq*2.1, t);
    osc.frequency.exponentialRampToValueAtTime(freq, t+0.1);
    gain.gain.setValueAtTime(gainVal, t);
    gain.gain.exponentialRampToValueAtTime(0.001, t+duration);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start(t); osc.stop(t+duration+0.05);
  }

  function playPad(freqs, duration, gainVal, dark){
    if(muted || !audioCtx) return;
    var t = audioCtx.currentTime;
    var filter = audioCtx.createBiquadFilter();
    filter.type = 'lowpass';
    filter.frequency.value = dark ? 520 : 1100;
    filter.Q.value = dark ? 1.4 : 0.6;
    var master = audioCtx.createGain();
    master.gain.setValueAtTime(0, t);
    master.gain.linearRampToValueAtTime(gainVal, t+0.35);
    master.gain.linearRampToValueAtTime(0, t+duration);
    filter.connect(master).connect(audioCtx.destination);
    freqs.forEach(function(f){
      var osc = audioCtx.createOscillator();
      osc.type = 'sawtooth';
      osc.frequency.value = f;
      osc.connect(filter);
      osc.start(t); osc.stop(t+duration+0.05);
    });
  }

  function playDreadThud(hard){

    osc.type = 'sine';

    gain.gain.setValueAtTime(hard ? 0.4 : 0.3, t);
    gain.gain.exponentialRampToValueAtTime(0.001, t+(hard ? 0.38 : 0.62));
    osc.connect(gain).connect(audioCtx.destination);

  function playBell(freq, gainVal){
    if(muted || !audioCtx) return;
    var t = audioCtx.currentTime;
    var partials = [1, 2.01, 2.41, 3.06, 4.18];
    var amps = [1, 0.55, 0.38, 0.22, 0.12];
    partials.forEach(function(mult, i){
      var osc = audioCtx.createOscillator();
      var gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.value = freq*mult;
      var g = (gainVal||0.14) * amps[i];
      gain.gain.setValueAtTime(0, t);
      gain.gain.linearRampToValueAtTime(g, t+0.012);
      gain.gain.exponentialRampToValueAtTime(0.0008, t+2.2-i*0.15);
      osc.connect(gain).connect(audioCtx.destination);
      osc.start(t); osc.stop(t+2.3);
    });
  }

  function playChoirPad(freqs, duration, gainVal){
    if(muted || !audioCtx) return;
    var t = audioCtx.currentTime;
    var filter = audioCtx.createBiquadFilter();
    filter.type = 'lowpass';
    filter.frequency.value = 620;
    filter.Q.value = 0.8;
    var master = audioCtx.createGain();
    master.gain.setValueAtTime(0, t);
    master.gain.linearRampToValueAtTime(gainVal, t+0.6);
    master.gain.linearRampToValueAtTime(0, t+duration);
    filter.connect(master).connect(audioCtx.destination);
    freqs.forEach(function(f){
      [0, 1, -1].forEach(function(detuneSteps){
        var osc = audioCtx.createOscillator();
        osc.type = 'sine';
        osc.frequency.value = f * Math.pow(2, detuneSteps*0.006);
        osc.connect(filter);
        osc.start(t); osc.stop(t+duration+0.05);
      });
    });
  }

  function scheduleStep(){
    if(!muted){
      var boss = musicMode === 'boss';
      var chord = BOSS_CHORDS[seqBar % 4];

      if(boss){
        if(seqStep % 4 === 0) playDreadThud(true);
      } else {
        if(seqStep === 0 || seqStep === 8) playDreadThud(false);
      }

      if(seqStep === 0){
        playBass808(chord.bass, boss ? 0.9 : 1.6, boss ? 0.3 : 0.22, 'triangle');
        playChoirPad(chord.pad, STEP_DUR*16, boss ? 0.06 : 0.045);
      }

      if(boss){
        var hatGain = (seqStep % 4 === 2) ? 0.07 : 0.045;
        noiseHit(0.05, hatGain, 0, 3200);
      } else if(Math.random() < 0.1){
        noiseHit(0.06, 0.03, 0, 2600);
      }

      if(chord.bell && (seqStep === 0 || (boss && seqStep === 8))){
        playBell(chord.bell, boss ? 0.16 : 0.11);
      }

      if(Math.random() < (boss ? 0.012 : 0.006)){
        playSting();
      }

      if(boss && seqStep === 14){
        noiseHit(0.02,0.06,0,7000);
        noiseHit(0.02,0.06,STEP_DUR*0.33,7000);
        noiseHit(0.02,0.06,STEP_DUR*0.66,7000);
      }
    }
    seqStep = (seqStep+1) % 16;
    if(seqStep === 0) seqBar = (seqBar+1) % 4;
  }

  function laneWidthAt(z){ return halfWidthAt(z) * (2/3); }
  function yAt(z){ return horizonY() + (groundY()-horizonY())*ease(z); }

  // ---------- Wave patterns ----------
  function randLane(){ return LANES[Math.floor(Math.random()*3)]; }

  var patterns = [
    function(){ return [{lane:randLane(), type:'barrier'}]; },
    function(){ return [{lane:randLane(), type:'beam'}]; },
    function(){ return [{lane:randLane(), type:'train'}]; },
    function(){
      var open = randLane();
      return LANES.filter(function(l){ return l!==open; }).map(function(l){ return {lane:l, type:'train'}; });
    },
    function(){
      var l1 = randLane(), l2;

      return [{lane:l1,type:'train'},{lane:l2,type:'barrier'}];
    },

  function pickPattern(diff){
    var pool = [0,1,2];
    if(diff > 0.15) pool.push(3);
    if(diff > 0.4) pool.push(4,5);
    var idx = pool[Math.floor(Math.random()*pool.length)];
    return patterns[idx]();

  function approachTime(diff){ return 2.0 - 0.9*diff; }

  function updatePowerupHUD(){

  function update(dt){
    if(state !== 'playing') return;
    if(paused) return;
    if(cutsceneActive) return;

    if(!(bossKind==='intro' && bossActive)) distance += speed*dt*140;
    difficulty = Math.min(1, distance/4200);
    speed = 0.55 + 0.7*difficulty;
    runCycle += dt*(6+8*speed);

    if(player.jumping){
      player.jumpT += dt;
      if(player.jumpT >= JUMP_DURATION){ player.jumping=false; player.jumpT=0; }
    }
    if(player.sliding){
      player.slideT += dt;
      if(player.slideT >= SLIDE_DURATION){ player.sliding=false; player.slideT=0; }
    }
    player.visualLane += (player.lane - player.visualLane) * Math.min(1, LANE_LERP_RATE*dt);

    // power-up timers
    if(activeEffects.shield>0){
      activeEffects.shield -= dt;
      if(activeEffects.shield<0) activeEffects.shield=0;
    }

    // invulnerability / hit feedback decay
    if(invulnTimer>0){
      invulnTimer -= dt;
      if(invulnTimer<0) invulnTimer=0;
    }
    if(hitFlashAlpha>0){
      hitFlashAlpha -= dt*2;
      if(hitFlashAlpha<0) hitFlashAlpha=0;
    }

    // ---- night / flash atmosphere ----
    var bossEventActive = bossWarningTimer>0 || bossActive;
    var nightTarget = bossEventActive ? 1 : 0;
    nightFactor += (nightTarget - nightFactor) * Math.min(1, dt*1.4);
    if(nightFactor<0.001) nightFactor=0;
    if(nightFactor>0.999) nightFactor=1;

    var redTarget = bossForm2 ? 1 : 0;
    redFactor += (redTarget - redFactor) * Math.min(1, dt*1.2);
    if(redFactor<0.001) redFactor=0;
    if(redFactor>0.999) redFactor=1;

    var wantedMusicMode = bossActive ? 'boss' : 'normal';
    if(wantedMusicMode !== musicMode){
      musicMode = wantedMusicMode;
      seqStep = 0; seqBar = 0;
    }

    if(THEME==='castle' || bossEventActive){
      flashTimer -= dt;
      if(flashTimer<=0){
        var stormIntensity = bossEventActive ? 1 : 0.55;
        flashAlpha = (0.3+Math.random()*0.25) * stormIntensity;
        flashTimer = bossEventActive ? (1.6+Math.random()*2.4) : (3.5+Math.random()*5);
        lightningBoltX = 0.12 + Math.random()*0.76;
        lightningBoltSeed = Math.random()*1000;
        if(Math.random() < (bossEventActive?0.75:0.6)) playThunder();
      }
    }
    if(flashAlpha>0){
      flashAlpha -= dt*2.2;
      if(flashAlpha<0) flashAlpha=0;
    }

    // ---- boss fight ----
    if(bossWarningTimer>0){
      bossWarningTimer -= dt;
      if(bossWarningTimer<0) bossWarningTimer=0;
      bossSirenTimer -= dt;
      if(bossSirenTimer<=0){
        playWarningSiren();
        bossSirenTimer = 0.7;
      }
    }
    if(bossDefeatFlashTimer>0){
      bossDefeatFlashTimer -= dt;
      if(bossDefeatFlashTimer<0) bossDefeatFlashTimer=0;
    }
    if(bossTransformFlash>0){
      bossTransformFlash -= dt;
      if(bossTransformFlash<0) bossTransformFlash=0;
    }

    if(bossKind === 'intro' && !introBossCleared && !bossActive){
      introHallwayTimer -= dt;
      if(introHallwayTimer <= 0){
        startIntroBossFight();
      }
    }

    if(!bossActive && !finalBossDefeated){
      if(distance >= nextBossDistance){
        obstacles = []; coins = []; powerUps = [];
        musicMode = 'boss'; seqStep = 0; seqBar = 0;
        startCutscene(BOSS_REVEAL_LINES, function(){
          bossActive = true;
          bossEncounterCount++;
          bossTypeIndex = STORY_BOSS_INDEX;
          var startBt = BOSS_TYPES[bossTypeIndex];
          bossMaxHealth = BOSS_HEALTH[bossTypeIndex];
          bossHealth = bossMaxHealth;
          bossWarningTimer = 0; bossWarningShown = false;
          bossTargetLanes = pickTargetLanes(1);
          bossHoverTarget = BOSS_HOME_LANE;
          bossLaneVisual = BOSS_HOME_LANE;
          bossPhase = 'moving'; bossPhaseTimer = 0;
          bossLabel.textContent = startBt.name;
          bossBar.classList.add('show');
          bossFill.style.width = '100%';
          playBossStart();
        });
      } else if(!bossWarningShown && nextBossDistance - distance < 650){
        bossWarningShown = true;
        bossWarningTimer = 2.6;
        bossSirenTimer = 0;
        obstacles = []; coins = []; powerUps = [];
        var upcomingIdx = STORY_BOSS_INDEX;
        bossWarningLabel = BOSS_TYPES[upcomingIdx].name + ' INCOMING';
        bossTaunt = BOSS_TAUNTS[upcomingIdx];
      }
    } else if(bossActive){
      var bt = (bossKind==='intro') ? INTRO_BOSS_CFG : BOSS_TYPES[bossTypeIndex];
      bossLaneVisual += (bossHoverTarget - bossLaneVisual) * Math.min(1, BOSS_LANE_LERP*dt);

      var meleeActive = (bossPhase==='charging' || bossPhase==='firing') && (bossKind==='intro' || bossAttackVariant==='melee');
      var zoomTarget = meleeActive ? 1 : 0;
      bossZoom += (zoomTarget - bossZoom) * Math.min(1, dt*6);

      if(bossPhase === 'moving'){
        if(Math.abs(bossLaneVisual-bossHoverTarget) < 0.04){
          bossPhase = 'charging';
          var phaseMult1 = bossRageMode ? RAGE_SPEED_MULT : (bossForm2 ? PHASE2_SPEED_MULT : PHASE1_SPEED_MULT);
          bossPhaseTimer = (bt.chargeMin + Math.random()*(bt.chargeMax-bt.chargeMin)) * phaseMult1;
          bossPhaseDuration = bossPhaseTimer;

          bossAttackVariant = (bossKind==='intro') ? (Math.random()<0.65 ? 'normal' : 'power') : (Math.random()<0.5 ? 'melee' : 'ranged');
          if(bossForm2){ bossTargetLanes = [bossHoverTarget]; }

          if(bossRageMode){
            bossFlipsRemaining = 2+Math.floor(Math.random()*2);
            var flipSpan = bossPhaseDuration * 0.55;
            bossNextFlipTimer = bossPhaseDuration*0.18 + Math.random()*flipSpan;
          } else {
            bossFlipsRemaining = 0;
            bossNextFlipTimer = 0;
          }
        }
      } else if(bossPhase === 'charging'){
        bossPhaseTimer -= dt;

        if(bossFlipsRemaining > 0){
          bossNextFlipTimer -= dt;
          if(bossNextFlipTimer <= 0 && bossPhaseTimer > 0.06){
            var otherLanes = LANES.filter(function(l){ return l !== bossTargetLanes[0]; });
            bossTargetLanes = [ otherLanes[Math.floor(Math.random()*otherLanes.length)] ];
            bossFlipsRemaining--;
            var remainTime = Math.max(0.05, bossPhaseTimer - 0.05);
            var nextGap = 0.08+Math.random()*0.14;
            bossNextFlipTimer = Math.min(nextGap, remainTime*0.6);
          }
        }

        if(bossPhaseTimer <= 0){
          bossPhase = 'firing';
          var isMelee = (bossKind==='intro') || (bossAttackVariant === 'melee');
          bossPhaseTimer = isMelee ? 0.22 : (bossForm2 ? 0.2 : 0.4);
          bossPhaseDuration = bossPhaseTimer;
          bossBeamLanes = bossTargetLanes.slice();
          bossBeamColor = bossForm2 ? '#ff2020' : '#c04dff';
          if(isMelee){ playLunge(); }
          else if(bossForm2){ playPlasmaFire(); }
          else { playGrenadeBlast(); }
          if(bossBeamLanes.indexOf(player.lane) !== -1){
            var bsx = laneCenterX(player.visualLane,1), bsy = groundY()-iH*0.1;
            takeHit(bsx, bsy, 1);
          }
        }
      } else if(bossPhase === 'firing'){
        bossPhaseTimer -= dt;
        if(bossPhaseTimer <= 0){
          bossPhase = 'cooldown';
          var phaseMult2 = bossRageMode ? RAGE_SPEED_MULT : (bossForm2 ? PHASE2_SPEED_MULT : PHASE1_SPEED_MULT);
          bossPhaseTimer = (bt.cooldownMin + Math.random()*(bt.cooldownMax-bt.cooldownMin)) * phaseMult2;
        }
      } else if(bossPhase === 'cooldown'){
        bossPhaseTimer -= dt;
        if(bossPhaseTimer <= 0){
          bossHealth--;
          bossFill.style.width = Math.max(0, (bossHealth/bossMaxHealth*100)) + '%';
          if(bossHealth <= 0){
            obstacles = []; coins = []; powerUps = [];
            if(bossKind === 'intro'){
              bossActive = false;
              bossDefeatFlashTimer = 1.4;
              bossBar.classList.remove('show');
              playBossDefeat();
              introBossCleared = true;
              bossKind = 'final';
              bossWarningShown = false; bossWarningTimer = 0;
              spawnTimer = 0.6; poleTimer = 0; powerupTimer = 9+Math.random()*6;
              musicMode = 'normal'; seqStep = 0; seqBar = 0;
            } else if(!bossForm2){
              startCutscene(TRANSFORM_LINES, function(){
                advanceBossEncounter();
              });
            } else if(!bossRageMode){
              startCutscene(RAGE_LINES, function(){
                advanceBossEncounter();
              });
            } else {
              startCutscene(FINAL_DEFEAT_LINES, function(){
                bossActive = false;
                bossDefeatFlashTimer = 1.6;
                bossBar.classList.remove('show');
                playBossDefeat();
                finalBossDefeated = true;
                obstacles = []; coins = []; powerUps = [];
                endingActive = true;
                endingTimer = ENDING_DURATION;
              });
            }
          } else {
            advanceBossEncounter();
          }
        }
      }
    }

    if(endingActive){
      endingTimer -= dt;
      speed = Math.max(0.32, speed - dt*0.14);
      if(endingTimer <= 0){
        endingActive = false;
        finishGame();
      }
    }

    if(!bossActive && !endingActive && !bossWarningShown && !(bossKind==='intro' && !introBossCleared)){
      spawnTimer -= dt;
      if(spawnTimer <= 0){
        spawnWave();
        spawnTimer = (1.5 - 0.65*difficulty) + (Math.random()*0.3-0.15);
      }
      powerupTimer -= dt;
      if(powerupTimer <= 0){
        spawnPowerUp();
        powerupTimer = 14+Math.random()*8;
      }
    }
    poleTimer -= dt;
    if(poleTimer <= 0){
      spawnPole();
      poleTimer = 0.35;
    }

    var i;
    for(i=obstacles.length-1;i>=0;i--){
      var o = obstacles[i];
      o.z += o.rate*dt;
      if(!o.checked && o.z >= 0.93){
        o.checked = true;
        if(o.lane === player.lane){
          var hit = true;
          if(o.type==='barrier' && player.jumping) hit = false;
          if(o.type==='beam' && player.sliding) hit = false;
          if(hit){
            var sx = laneCenterX(player.visualLane,1), sy = groundY()-iH*0.1;
            takeHit(sx, sy);
          }
        }
      }
      if(o.z > 1.2) obstacles.splice(i,1);
    }

    for(i=powerUps.length-1;i>=0;i--){
      var pu = powerUps[i];
      pu.z += pu.rate*dt;
      if(!pu.collected && pu.z >= 0.9 && pu.z <= 1.06 && pu.lane === player.lane){
        pu.collected = true;
        activeEffects.shield = 10;
        var px = laneCenterX(player.visualLane,1), py = groundY()-iH*0.08;
        burst(px,py,'#3ca7e0',12);
        playPowerup();
      }
      if(pu.z > 1.2) powerUps.splice(i,1);
    }

    for(i=poles.length-1;i>=0;i--){
      poles[i].z += poles[i].rate*dt;
      if(poles[i].z > 1.2) poles.splice(i,1);
    }

    for(i=particles.length-1;i>=0;i--){
      var p = particles[i];
      p.life -= dt;
      p.x += p.vx*dt; p.y += p.vy*dt; p.vy += 220*dt;
      if(p.life<=0) particles.splice(i,1);
    }

    updatePowerupHUD();
  }

  // ---------- Render helpers: pixel sprites ----------
  function hexToRgb(hex){
    var num = parseInt(hex.replace('#',''),16);
    return [(num>>16)&255, (num>>8)&255, num&255];
  }
  function lerpColor(hexA,hexB,t){
    var a = hexToRgb(hexA), b = hexToRgb(hexB);
    var r = Math.round(a[0]+(b[0]-a[0])*t);
    var g = Math.round(a[1]+(b[1]-a[1])*t);
    var bl = Math.round(a[2]+(b[2]-a[2])*t);
    return 'rgb('+r+','+g+','+bl+')';
  }
  function lerpColorAlpha(hexA,hexB,t,alpha){
    var a = hexToRgb(hexA), b = hexToRgb(hexB);
    var r = Math.round(a[0]+(b[0]-a[0])*t);
    var g = Math.round(a[1]+(b[1]-a[1])*t);
    var bl = Math.round(a[2]+(b[2]-a[2])*t);
    return 'rgba('+r+','+g+','+bl+','+alpha+')';
  }

  function shadeColor(hex, factor){
    var rgb = hexToRgb(hex);
    var r = Math.max(0,Math.min(255,Math.round(rgb[0]*factor)));
    var g = Math.max(0,Math.min(255,Math.round(rgb[1]*factor)));
    var b = Math.max(0,Math.min(255,Math.round(rgb[2]*factor)));
    return 'rgb('+r+','+g+','+b+')';
  }
  function drawGroundShadow(x, y, halfW, alpha){
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.fillStyle = '#000000';
    ctx.beginPath();
    ctx.ellipse(x, y, Math.max(2,halfW), Math.max(1,halfW*0.32), 0, 0, Math.PI*2);
    ctx.fill();
    ctx.restore();
  }

  var SPRITE_FADE_DUR = 0.09;
  function drawAnimatedSprite(state, img, dx, dy, dw, dh){
    if(!img || !img.complete || !img.naturalWidth) return;
    var now = performance.now();
    if(img !== state.currentImg){
      state.prevImg = state.currentImg;
      state.switchStart = now;
      state.currentImg = img;
    }
    var p = (state.switchStart === undefined) ? 1 : Math.min(1, (now - state.switchStart)/1000/SPRITE_FADE_DUR);
    if(p < 1 && state.prevImg && state.prevImg.complete && state.prevImg.naturalWidth){
      ctx.save();
      ctx.globalAlpha = 1-p;
      ctx.drawImage(state.prevImg, dx, dy, dw, dh);
      ctx.restore();
    }
    ctx.save();
    ctx.globalAlpha = p < 1 ? p : 1;
    ctx.drawImage(img, dx, dy, dw, dh);
    ctx.restore();
  }

  function drawPixelSun(cx,cy,r,color){
    ctx.fillStyle = color;
    var w1 = r*1.2, w2 = r*1.9;
    ctx.fillRect(Math.round(cx-w1/2), Math.round(cy-r), Math.round(w1), Math.round(r*0.45));
    ctx.fillRect(Math.round(cx-w2/2), Math.round(cy-r*0.55), Math.round(w2), Math.round(r*1.1));
    ctx.fillRect(Math.round(cx-w1/2), Math.round(cy+r*0.55), Math.round(w1), Math.round(r*0.45));
  }

  function drawCloud(cx,cy,r,alpha){
    ctx.fillStyle = 'rgba(224,190,255,'+alpha.toFixed(2)+')';
    ctx.fillRect(Math.round(cx-r*1.6), Math.round(cy-r*0.4), Math.round(r*3.2), Math.round(r*0.8));
    ctx.fillRect(Math.round(cx-r*0.9), Math.round(cy-r*0.9), Math.round(r*1.8), Math.round(r*0.7));
    ctx.fillRect(Math.round(cx+r*0.3), Math.round(cy-r*0.7), Math.round(r*1.4), Math.round(r*0.6));
  }

  var stars = [];
  (function initStars(){
    for(var i=0;i<50;i++){
      stars.push({ fx:Math.random(), fy:Math.random()*0.7, r:Math.random()*1.2+0.5, phase:Math.random()*Math.PI*2 });
    }
  })();

  function drawSkyline(){
    var hy = horizonY();
    var tileW = iW*0.55;
    var scrollOffset = (distance*0.05) % tileW;
    var maxH = hy*0.55;
    for(var rep=-1; rep<=1; rep++){
      var baseX = rep*tileW - scrollOffset;
      for(var bi=0; bi<buildings.length; bi++){
        var b = buildings[bi];
        var bx = baseX + b.fx*tileW;
        var bw = b.fw*tileW;
        var bh = b.fh*maxH;
        var by = hy-bh;
        if(THEME === 'forest'){
          ctx.fillStyle = '#1f3a24';
          ctx.beginPath();
          ctx.moveTo(bx+bw/2, by);
          ctx.lineTo(bx, hy+1);
          ctx.lineTo(bx+bw, hy+1);
          ctx.closePath();
          ctx.fill();
        } else if(THEME === 'castle'){
          var stoneBase = redFactor>0.01 ? lerpColor('#241f2e','#3a1414',redFactor) : '#241f2e';
          var stoneSeam = redFactor>0.01 ? lerpColor('#161320','#240d0d',redFactor) : '#161320';
          var torchColor = redFactor>0.01 ? lerpColor('#ffb84a','#ff5030',redFactor) : '#ffb84a';
          ctx.fillStyle = stoneBase;
          ctx.fillRect(Math.round(bx), Math.round(by), Math.round(bw), Math.round(bh)+2);

          ctx.save();
          ctx.strokeStyle = stoneSeam;
          ctx.lineWidth = 1;
          ctx.beginPath();
          var seamRows = Math.max(2, Math.round(bh/(iH*0.045)));
          for(var sr=1; sr<seamRows; sr++){
            var sy = by + (bh*sr/seamRows);
            ctx.moveTo(bx, sy); ctx.lineTo(bx+bw, sy);
          }
          var seamCols = Math.max(1, Math.round(bw/(iW*0.035)));
          for(var sc=1; sc<seamCols; sc++){
            var sx = bx + (bw*sc/seamCols);
            ctx.moveTo(sx, by); ctx.lineTo(sx, by+bh);
          }
          ctx.stroke();
          ctx.restore();

          var crenW = Math.max(2, bw*0.22);
          for(var cx=bx; cx<bx+bw; cx+=crenW*2){
            ctx.fillStyle = stoneBase;
            ctx.fillRect(Math.round(cx), Math.round(by-crenW*0.55), Math.round(crenW), Math.round(crenW*0.6));
          }
          ctx.fillStyle = torchColor;
          for(var wi=0; wi<b.windows.length; wi++){
            var w = b.windows[wi];
            var wx = bx + w.cx*bw, wy = by + w.cy*bh;
            ctx.fillRect(Math.round(wx-1), Math.round(wy-1.5), 2, 3);
          }
        } else {
          ctx.fillStyle = redFactor>0.01 ? lerpColor('#3a1060','#601010',redFactor) : '#3a1060';
          ctx.fillRect(Math.round(bx), Math.round(by), Math.round(bw), Math.round(bh)+2);
          ctx.fillStyle = redFactor>0.01 ? lerpColor('#ff6ae0','#ff3030',redFactor) : '#ff6ae0';
          for(var wi2=0; wi2<b.windows.length; wi2++){
            var w2 = b.windows[wi2];
            var wx2 = bx + w2.cx*bw, wy2 = by + w2.cy*bh;
            ctx.fillRect(Math.round(wx2-1), Math.round(wy2-1), 2, 2);
          }
        }
      }
    }
  }

  function drawCastleGate(){
    var hy = horizonY();
    var cx = iW/2;
    var gateH = hy*0.82, gateW = gateH*0.62;
    var baseY = hy+1;
    var topY = baseY-gateH;
    var stoneBase = redFactor>0.01 ? lerpColor('#2c2636','#3e1818',redFactor) : '#2c2636';
    var stoneDark = redFactor>0.01 ? lerpColor('#1c1722','#280e0e',redFactor) : '#1c1722';
    var torchColor = redFactor>0.01 ? lerpColor('#ffc766','#ff6a3a',redFactor) : '#ffc766';

    // central keep body
    ctx.fillStyle = stoneBase;
    ctx.fillRect(Math.round(cx-gateW/2), Math.round(topY), Math.round(gateW), Math.round(gateH));

    // crenellations along the top
    var crenW = gateW*0.11;
    for(var cxi=cx-gateW/2; cxi<cx+gateW/2; cxi+=crenW*2){
      ctx.fillRect(Math.round(cxi), Math.round(topY-crenW*0.7), Math.round(crenW), Math.round(crenW*0.75));
    }

    // flanking corner turrets
    var turW = gateW*0.22, turH = gateH*1.14;
    [cx-gateW/2-turW*0.42, cx+gateW/2-turW*0.58].forEach(function(tx){
      var ty = baseY-turH;
      ctx.fillStyle = stoneDark;
      ctx.fillRect(Math.round(tx), Math.round(ty), Math.round(turW), Math.round(turH));
      ctx.beginPath();
      ctx.moveTo(tx, ty);
      ctx.lineTo(tx+turW/2, ty-turH*0.16);
      ctx.lineTo(tx+turW, ty);
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle = torchColor;
      ctx.fillRect(Math.round(tx+turW*0.4), Math.round(ty+turH*0.22), 2, 3);
    });

    // the door — a dark arch centered in the keep
    var doorW = gateW*0.34, doorH = gateH*0.5;
    var doorX = cx-doorW/2, doorY = baseY-doorH;
    ctx.fillStyle = stoneDark;
    ctx.beginPath();
    ctx.moveTo(doorX, doorY+doorH);
    ctx.lineTo(doorX, doorY+doorH*0.28);
    ctx.quadraticCurveTo(doorX, doorY, cx, doorY);
    ctx.quadraticCurveTo(doorX+doorW, doorY, doorX+doorW, doorY+doorH*0.28);
    ctx.lineTo(doorX+doorW, doorY+doorH);
    ctx.closePath();
    ctx.fill();

    // torches either side of the door
    var flick = 0.75+0.25*Math.sin(performance.now()/140);
    [doorX-gateW*0.07, doorX+doorW+gateW*0.07].forEach(function(fx){
      var fy = doorY+doorH*0.35;
      ctx.fillStyle = '#2a2320';
      ctx.fillRect(Math.round(fx-1), Math.round(fy), 2, Math.round(gateH*0.1));
      ctx.save();
      ctx.globalAlpha = flick;
      var grad = ctx.createRadialGradient(fx,fy,0,fx,fy,gateH*0.05);
      grad.addColorStop(0,'#fff2c0');
      grad.addColorStop(0.5,torchColor);
      grad.addColorStop(1,'rgba(255,150,50,0)');
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(fx,fy,gateH*0.05,0,Math.PI*2);
      ctx.fill();
      ctx.restore();
    });

    // narrow window slits up the keep face
    ctx.fillStyle = torchColor;
    [[-0.22,0.16],[0.22,0.16],[-0.22,-0.12],[0.22,-0.12]].forEach(function(pos){
      var wx = cx+pos[0]*gateW, wy = topY+gateH*0.38+pos[1]*gateH*0.4;
      ctx.fillRect(Math.round(wx-1), Math.round(wy-2), 2, 4);
    });
  }

  function drawLightningBolt(fx, topY, botY, seed, alpha){
    var x0 = fx*iW;
    var segs = 7;
    var h = botY - topY;
    var pts = [{x:x0, y:topY}];
    var x = x0;
    for(var i=1; i<=segs; i++){
      var frac = i/segs;
      var y = topY + h*frac;
      var jitter = Math.sin(seed + i*2.7) * iW*0.05 * (1-frac*0.3);
      x = x0 + jitter + (Math.sin(seed*1.7+i*5.1))*iW*0.02;
      pts.push({x:x, y:y});
    }
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.strokeStyle = '#dfe8ff';
    ctx.shadowColor = '#c8d8ff';
    ctx.shadowBlur = 10;
    ctx.lineWidth = 3;
    ctx.lineJoin = 'round';
    ctx.beginPath();
    pts.forEach(function(p, i){ if(i===0) ctx.moveTo(p.x,p.y); else ctx.lineTo(p.x,p.y); });
    ctx.stroke();

    // a couple of small branch forks
    for(var bi=2; bi<pts.length-1; bi+=2){
      var bp = pts[bi];
      var bx = bp.x + Math.sin(seed*3.1+bi)*iW*0.09;
      var by = bp.y + h*0.12;
      ctx.beginPath();
      ctx.moveTo(bp.x, bp.y);
      ctx.lineTo(bx, by);
      ctx.stroke();
    }

    ctx.lineWidth = 1;
    ctx.strokeStyle = '#ffffff';
    ctx.shadowBlur = 0;
    ctx.beginPath();
    pts.forEach(function(p, i){ if(i===0) ctx.moveTo(p.x,p.y); else ctx.lineTo(p.x,p.y); });
    ctx.stroke();
    ctx.restore();
  }

  function drawSky(){
    var hy = horizonY();
    var dayBands = THEME === 'forest'
      ? ['#4a90d9','#79b8e8','#a8d4c8','#dcefd0']
      : THEME === 'castle'
        ? ['#1c1f33','#2c2f4a','#454866','#6a6684']
        : ['#2a0f4a','#5a1a8a','#9a3ad0','#e896ff'];
    var nightBands = THEME === 'castle' ? ['#04040a','#0a0a17','#111226','#1a1830'] : ['#05040d','#0d0a1f','#161233','#241a3a'];
    var redNightBands = ['#0d0303','#1f0808','#330f0f','#451515'];
    var stops = [0.0, 0.34, 0.62, 0.85];
    var skyGrad = ctx.createLinearGradient(0, 0, 0, hy);
    for(var bi=0; bi<stops.length; bi++){
      var nightColor = redFactor>0.01 ? lerpColor(nightBands[bi], redNightBands[bi], redFactor) : nightBands[bi];
      skyGrad.addColorStop(stops[bi], lerpColor(dayBands[bi], nightColor, nightFactor));
    }
    ctx.fillStyle = skyGrad;
    ctx.fillRect(0, 0, iW, Math.ceil(hy)+1);

    if(nightFactor>0.02 || THEME==='castle'){
      var starAlphaBase = THEME==='castle' ? Math.max(nightFactor,0.55) : nightFactor;
      var t = performance.now()/1000;
      for(var si=0; si<stars.length; si++){
        var st = stars[si];
        var tw = 0.4+0.5*Math.sin(t*1.4+st.phase);
        ctx.fillStyle = 'rgba(244,238,255,'+Math.max(0,(tw*starAlphaBase*0.7)).toFixed(2)+')';
        ctx.fillRect(Math.round(st.fx*iW), Math.round(st.fy*hy), Math.max(1,st.r), Math.max(1,st.r));
      }
    }

    if(THEME === 'castle'){
      var stormCloudAlpha = 0.5;
      drawCloud(((cloudT*6) % (iW+50))-25, hy*0.16, iH*0.035, stormCloudAlpha);
      drawCloud(((cloudT*4 + iW*0.5) % (iW+70))-35, hy*0.3, iH*0.05, stormCloudAlpha*0.9);
      drawCloud(((cloudT*5 + iW*0.2) % (iW+60))-30, hy*0.1, iH*0.04, stormCloudAlpha*0.8);
      if(flashAlpha>0.12){
        ctx.save();
        ctx.globalAlpha = Math.min(0.5, flashAlpha);
        ctx.fillStyle = '#e8ecff';
        ctx.fillRect(0,0,iW,Math.ceil(hy)+1);
        ctx.restore();
        drawLightningBolt(lightningBoltX, hy*0.04, hy*0.96, lightningBoltSeed, Math.min(1, flashAlpha*1.8));
      }
      drawSkyline();
      drawCastleGate();
      return;
    }

    var sunColor = lerpColor('#ff6ad5', '#c8a0ff', nightFactor);
    if(redFactor>0.01) sunColor = lerpColor(sunColor, '#ff2020', redFactor);
    drawPixelSun(iW*0.16, hy*0.24, iH*0.05, sunColor);
    var cloudAlpha = 0.85*(1-nightFactor*0.7);
    drawCloud(((cloudT*6) % (iW+50))-25, hy*0.16, iH*0.03, cloudAlpha);
    drawCloud(((cloudT*4 + iW*0.5) % (iW+70))-35, hy*0.34, iH*0.04, cloudAlpha);
    drawSkyline();
  }

  function drawCastleGroundBands(hy, gy){
    var t = performance.now()/1000;
    var p1 = hy + (gy-hy)*0.07;   // end of stone wall footing
    var p2 = hy + (gy-hy)*0.34;   // end of brick apron

    // ---- stone wall footing ----
    var stoneBase = redFactor>0.01 ? lerpColor('#332d3d','#4a1f1f',redFactor) : '#332d3d';
    var stoneMortar = redFactor>0.01 ? lerpColor('#1c1722','#280e0e',redFactor) : '#1c1722';
    ctx.fillStyle = stoneBase;
    ctx.fillRect(0, Math.floor(hy), iW, Math.ceil(p1-hy));
    ctx.strokeStyle = stoneMortar;
    ctx.lineWidth = 1;
    ctx.beginPath();
    var blockW = iW*0.10;
    for(var bx=0; bx<iW; bx+=blockW){
      ctx.moveTo(bx, hy); ctx.lineTo(bx, p1);
    }
    ctx.moveTo(0, hy+(p1-hy)*0.5); ctx.lineTo(iW, hy+(p1-hy)*0.5);
    ctx.stroke();

    // ---- brick apron ----
    var brickBase = redFactor>0.01 ? lerpColor('#8a4a2a','#7a2a18',redFactor) : '#8a4a2a';
    var brickMortar = redFactor>0.01 ? lerpColor('#5a3520','#452015',redFactor) : '#5a3520';
    ctx.fillStyle = brickBase;
    ctx.fillRect(0, Math.floor(p1), iW, Math.ceil(p2-p1));
    ctx.strokeStyle = brickMortar;
    ctx.lineWidth = 1;
    var rowH = (p2-p1)/3;
    ctx.beginPath();
    for(var ri=0; ri<=3; ri++){
      var ry = p1+ri*rowH;
      ctx.moveTo(0, ry); ctx.lineTo(iW, ry);
    }
    var brickW = iW*0.075;
    for(var ri2=0; ri2<3; ri2++){
      var ry0=p1+ri2*rowH, ry1=p1+(ri2+1)*rowH;
      var offset = (ri2%2===0) ? 0 : brickW/2;
      for(var bx2=-offset; bx2<iW; bx2+=brickW){
        ctx.moveTo(bx2, ry0); ctx.lineTo(bx2, ry1);
      }
    }
    ctx.stroke();

    // ---- water moat ----
    var waterGrad = ctx.createLinearGradient(0, p2, 0, gy);
    var waterTop = redFactor>0.01 ? lerpColor('#1a3a5c','#3a1a1a',redFactor) : '#1a3a5c';
    var waterBot = redFactor>0.01 ? lerpColor('#2f6f9e','#5a2a20',redFactor) : '#2f6f9e';
    waterGrad.addColorStop(0, waterTop);
    waterGrad.addColorStop(1, waterBot);
    ctx.fillStyle = waterGrad;
    ctx.fillRect(0, Math.floor(p2), iW, Math.ceil(gy-p2));

    ctx.strokeStyle = 'rgba(180,220,255,0.35)';
    ctx.lineWidth = 1;
    var rippleRows = 6;
    for(var wi=0; wi<rippleRows; wi++){
      var frac = wi/(rippleRows-1);
      var wy = p2 + (gy-p2)*frac;
      var amp = 1+3*frac;
      var freq = 0.08+0.02*wi;
      ctx.beginPath();
      for(var x=0; x<=iW; x+=4){
        var yy = wy + Math.sin(x*freq + t*1.2 + wi)*amp;
        if(x===0) ctx.moveTo(x,yy); else ctx.lineTo(x,yy);
      }
      ctx.stroke();
    }

    for(var si=0; si<10; si++){
      var sx = (Math.sin(si*12.9)*0.5+0.5)*iW;
      var sfrac = (Math.sin(si*5.7+1)*0.5+0.5);
      var sy = p2 + (gy-p2)*sfrac;
      var alpha = 0.4+0.4*Math.sin(t*3+si);
      ctx.globalAlpha = Math.max(0, alpha);
      ctx.fillStyle = '#eaf6ff';
      ctx.fillRect(sx, sy, 1, 1);
    }
    ctx.globalAlpha = 1;
  }

  function drawRoad(){
    var hy = horizonY(), gy = groundY();
    var topH = roadTopHalf(), botH = roadBottomHalf();
    var isForest = THEME === 'forest';
    var isCastle = THEME === 'castle';

    if(isCastle){
      drawCastleGroundBands(hy, gy);
    } else {
      var groundColor = isForest
        ? (redFactor>0.01 ? lerpColor('#2f4a2a','#4a1f1f',redFactor) : '#2f4a2a')
        : (redFactor>0.01 ? lerpColor('#160a2a','#300a0a',redFactor) : '#160a2a');
      ctx.fillStyle = groundColor;
      ctx.fillRect(0, Math.floor(hy), iW, Math.ceil(gy-hy));
    }

    ctx.beginPath();
    ctx.moveTo(iW/2-topH, hy);
    ctx.lineTo(iW/2+topH, hy);
    ctx.lineTo(iW/2+botH, gy);
    ctx.lineTo(iW/2-botH, gy);
    ctx.closePath();
    ctx.fillStyle = isForest ? '#5a4a34' : isCastle ? (redFactor>0.01 ? lerpColor('#3a3644','#4a1f1f',redFactor) : '#3a3644') : (redFactor>0.01 ? lerpColor('#2a1045','#450f0f',redFactor) : '#2a1045');
    ctx.fill();

    ctx.save();
    ctx.clip();
    ctx.strokeStyle = isForest ? '#463824' : isCastle ? (redFactor>0.01 ? lerpColor('#252030','#341414',redFactor) : '#252030') : (redFactor>0.01 ? lerpColor('#4a1a6a','#6a1a1a',redFactor) : '#4a1a6a');
    var dz = 0.16, off = (distance*0.03) % dz;
    for(var z=off; z<1.02; z+=dz){
      var yy = Math.round(yAt(z));
      var hw = halfWidthAt(z);
      ctx.lineWidth = Math.max(1, Math.round(2*scaleAt(z)));
      ctx.beginPath();
      ctx.moveTo(iW/2-hw, yy);
      ctx.lineTo(iW/2+hw, yy);
      ctx.stroke();
    }
    ctx.restore();

    ctx.strokeStyle = isForest ? '#e8dcc0' : isCastle ? (redFactor>0.01 ? lerpColor('#8a7a5a','#b04a30',redFactor) : '#8a7a5a') : (redFactor>0.01 ? lerpColor('#ff6ae0','#ff3030',redFactor) : '#ff6ae0');
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(iW/2-topH,hy); ctx.lineTo(iW/2-botH,gy);
    ctx.moveTo(iW/2+topH,hy); ctx.lineTo(iW/2+botH,gy);
    ctx.stroke();

    ctx.setLineDash([6,5]);
    ctx.lineDashOffset = -(distance*0.9) % 11;
    ctx.strokeStyle = isForest ? 'rgba(232,220,192,0.6)' : isCastle ? 'rgba(170,158,132,0.55)' : lerpColorAlpha('#ff8ae8','#ff5050',redFactor,0.6);
    ctx.lineWidth = 1.5;
    [-0.5,0.5].forEach(function(l){
      ctx.beginPath();
      ctx.moveTo(laneCenterX(l,0),hy);
      ctx.lineTo(laneCenterX(l,1),gy);
      ctx.stroke();
    });
    ctx.setLineDash([]);
  }

  function drawPole(p){

    ctx.moveTo(Math.round(edgeX), Math.round(y));
    ctx.lineTo(Math.round(edgeX), Math.round(y-h));
    ctx.stroke();
    var lampSize = Math.max(2, 4*s);

    } else {
      ctx.fillStyle = redFactor>0.01 ? lerpColor('#ff6ae0','#ff3030',redFactor) : '#ff6ae0';

  function drawPlayer(){
    var blink = invulnTimer>0 && Math.floor(performance.now()/90)%2===0;
    var x = laneCenterX(player.visualLane,1);
    var baseY = groundY() - iH*0.015;
    var jumpOffset = 0;
    if(player.jumping){
      var jp = player.jumpT/JUMP_DURATION;
      jumpOffset = -Math.sin(jp*Math.PI)*iH*0.17;
    }
    var y = baseY + jumpOffset;

    var laneDelta = player.lane - player.visualLane;
    var img;
    if(invulnTimer>0){
      img = playerStumbleImg;
    } else if(player.jumping){
      img = playerJumpImg;
    } else if(player.sliding){
      img = playerSlideImg;
    } else if(laneDelta > 0.06){
      img = playerLeanRightImg;
    } else if(laneDelta < -0.06){
      img = playerLeanLeftImg;
    } else {
      img = Math.sin(runCycle) > 0 ? playerRun1Img : playerRun2Img;
    }

    if(blink) return;

    var bodyH = iH*0.15;
    if(player.sliding) bodyH *= 0.72;
    var aspect = (img.complete && img.naturalWidth>0) ? (img.naturalWidth/img.naturalHeight) : 0.4;
    var bodyW = bodyH*aspect;

    drawGroundShadow(x, baseY, bodyW*0.85, 0.28);

    if(img.complete && img.naturalWidth>0){
      drawAnimatedSprite(playerAnimState, img, Math.round(x-bodyW/2), Math.round(y-bodyH), Math.round(bodyW), Math.round(bodyH));
    }
  }

  function drawRedLaser(x, topY, botY, alpha, seed){
    var h = botY - topY;
    var t = performance.now()/1000 + seed;
    var jitter = Math.sin(t*40)*iH*0.006;
    ctx.save();
    ctx.globalAlpha = alpha;
    var glowW = iH*0.05, coreW = iH*0.018;
    var grad = ctx.createLinearGradient(x-glowW, topY, x+glowW, topY);
    grad.addColorStop(0, 'rgba(255,20,20,0)');
    grad.addColorStop(0.5, 'rgba(255,50,50,0.9)');
    grad.addColorStop(1, 'rgba(255,20,20,0)');
    ctx.fillStyle = grad;
    ctx.fillRect(x-glowW+jitter, topY, glowW*2, h);
    ctx.fillStyle = '#ffe0e0';
    ctx.fillRect(x-coreW/2+jitter, topY, coreW, h);
    ctx.strokeStyle = 'rgba(255,255,255,0.65)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    var segs = 5;
    for(var i=0; i<segs; i++){
      var frac = i/(segs-1);
      var sy = topY + h*frac;
      var sx = x + Math.sin(t*25 + i*3)*iH*0.012 + jitter;
      if(i===0) ctx.moveTo(sx,sy); else ctx.lineTo(sx,sy);
    }
    ctx.stroke();
    ctx.restore();
  }

    ctx.fillStyle = grad;

    ctx.fill();
    ctx.fillStyle = '#fff0ff';

  }

  function drawClawSwipe(x, y, progress, color){
    var spread = iH*(0.05 + 0.05*Math.sin(Math.min(1,progress)*Math.PI));
    var alpha = Math.max(0, 1-progress);
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.strokeStyle = color;
    ctx.lineWidth = Math.max(1.5, iH*0.012);
    for(var i=-1; i<=1; i++){
      ctx.beginPath();
      ctx.moveTo(x - spread*0.6 + i*iH*0.02, y - spread*0.9);
      ctx.lineTo(x + spread*0.6 + i*iH*0.02, y + spread*0.9);
      ctx.stroke();
    }
    ctx.restore();

    ctx.save();
    ctx.globalAlpha = alpha*0.6;
    var grad = ctx.createRadialGradient(x,y,0,x,y,spread);
    grad.addColorStop(0, color);
    grad.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(x,y,spread,0,Math.PI*2);
    ctx.fill();
    ctx.restore();
  }

    if(bossPhase==='charging'){
      ctx.save();
      ctx.strokeStyle = bossAttackVariant==='power' ? 'rgba(192,77,255,0.85)' : 'rgba(228,66,63,0.85)';
      ctx.lineWidth = 2;
      bossTargetLanes.forEach(function(lane){
        var gx = laneCenterX(lane, 1);
        var pulse = 0.65+0.35*Math.sin(performance.now()/90);
        var ringR = iH*0.028*pulse;
        ctx.beginPath();
        ctx.arc(gx, groundY()-4, Math.max(2,ringR), 0, Math.PI*2);
        ctx.stroke();
      });
      ctx.restore();
    } else if(bossPhase==='firing'){
      var fireProgress = 1 - Math.max(0, bossPhaseTimer)/Math.max(0.01, bossPhaseDuration);
      var color = bossAttackVariant==='power' ? '#c04dff' : '#e4423f';
      bossBeamLanes.forEach(function(lane){
        var x = laneCenterX(lane, 1);
        drawClawSwipe(x, groundY()-4, fireProgress, color);
      });
    }
  }

  function drawBossAttack(){
    var isPhase1 = !bossForm2;
    var isMelee = bossAttackVariant === 'melee';

    if(bossPhase==='charging'){
      ctx.save();
      ctx.strokeStyle = isPhase1 ? 'rgba(190,90,255,0.85)' : 'rgba(255,40,40,0.9)';
      ctx.lineWidth = 2;
      bossTargetLanes.forEach(function(lane){
        var gx = laneCenterX(lane, 1);
        var pulse = 0.65+0.35*Math.sin(performance.now()/90);
        var ringR = iH*0.028*pulse;
        ctx.beginPath();
        ctx.arc(gx, groundY()-4, Math.max(2,ringR), 0, Math.PI*2);
        ctx.stroke();
      });
      ctx.restore();

      if(!isMelee && isPhase1){
        var chargeProgress = 1 - Math.max(0, bossPhaseTimer)/Math.max(0.01, bossPhaseDuration);
        var bx = laneCenterX(bossLaneVisual, 1);
        var by = groundY() - iH*0.015 - iH*0.36 + Math.sin(performance.now()/260)*2;
        bossTargetLanes.forEach(function(lane, idx){
          var tx = laneCenterX(lane, 1), ty = groundY()-4;
          var px = bx + (tx-bx)*chargeProgress;
          var arcH = iH*0.14;
          var py = by + (ty-by)*chargeProgress - Math.sin(chargeProgress*Math.PI)*arcH;
          drawFireball(px, py, chargeProgress*10 + idx);
        });
      }
    } else if(bossPhase==='firing'){
      var fireProgress = 1 - Math.max(0, bossPhaseTimer)/Math.max(0.01, bossPhaseDuration);
      if(isMelee){
        bossBeamLanes.forEach(function(lane){
          var x = laneCenterX(lane, 1);
          drawClawSwipe(x, groundY()-4, fireProgress, isPhase1 ? '#c04dff' : '#ff2020');
        });
        return;
      }
      if(isPhase1){
        bossBeamLanes.forEach(function(lane){
          var x = laneCenterX(lane, 1);
          drawFireballBurst(x, groundY()-4, fireProgress);
        });
      } else {
        var topY = groundY() - iH*0.36;
        var botY = groundY();
        var alpha = Math.min(1, 1-fireProgress*0.7);
        bossBeamLanes.forEach(function(lane){
          var x = laneCenterX(lane, 1);
          drawRedLaser(x, topY, botY, alpha, lane*13.7);
        });
      }
    }
  }

  function drawParticles(){
    particles.forEach(function(p){
      var a = Math.max(0, p.life/p.maxLife);
      ctx.globalAlpha = a;
      ctx.fillStyle = p.color;
      ctx.fillRect(Math.round(p.x-2), Math.round(p.y-2), 4, 4);
      ctx.globalAlpha = 1;
    });
  }

  function render(){
    ctx.clearRect(0,0,iW,iH);
    drawSky();
    drawRoad();
    if(endingActive){
      var endingProgress = 1 - Math.max(0,endingTimer)/ENDING_DURATION;
      var hy = horizonY();
      var cx = iW/2, cy = hy*0.7;
      var maxR = Math.max(iW,iH)*0.85;
      var r = Math.max(4, maxR*endingProgress);
      var glowGrad = ctx.createRadialGradient(cx,cy,0,cx,cy,r);
      glowGrad.addColorStop(0, 'rgba(255,250,225,'+(0.85*endingProgress).toFixed(2)+')');
      glowGrad.addColorStop(0.55, 'rgba(255,222,150,'+(0.45*endingProgress).toFixed(2)+')');
      glowGrad.addColorStop(1, 'rgba(255,222,150,0)');
      ctx.fillStyle = glowGrad;
      ctx.fillRect(0,0,iW,iH);
    }

    var entities = [];
    poles.forEach(function(p){ entities.push({z:p.z, draw:function(){drawPole(p);}}); });
    obstacles.forEach(function(o){ entities.push({z:o.z, draw:function(){
      if(o.type==='train') drawTrain(o);
      else if(o.type==='barrier') drawBarrier(o);
      else drawBeam(o);
    }}); });
    powerUps.forEach(function(pu){ if(!pu.collected) entities.push({z:pu.z, draw:function(){drawPowerBadge(pu);}}); });

    entities.sort(function(a,b){ return a.z-b.z; });
    entities.forEach(function(e){ e.draw(); });

    if(state==='playing' || state==='ended') drawPlayer();
    if(bossActive){
      if(bossKind==='intro'){ drawIntroBossAttack(); } else { drawBossAttack(); }
      drawFloatingBoss();
    }
    drawParticles();

    if(bossWarningTimer>0){
      if(Math.sin(performance.now()/120)>0){
        ctx.save();
        ctx.font = 'bold ' + Math.round(iH*0.05) + 'px monospace';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.lineWidth = 3;
        ctx.strokeStyle = '#1a1a2e';
        ctx.fillStyle = '#e4423f';
        var wy = horizonY()*0.5;
        ctx.strokeText(bossWarningLabel, iW/2, wy);
        ctx.fillText(bossWarningLabel, iW/2, wy);
        ctx.restore();
      }
      if(bossTaunt){
        ctx.save();
        ctx.font = Math.round(iH*0.028) + 'px monospace';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.lineWidth = 2;
        ctx.strokeStyle = '#1a1a2e';
        ctx.fillStyle = '#f4f4f4';
        var ty2 = horizonY()*0.5 + iH*0.075;
        ctx.strokeText(bossTaunt, iW/2, ty2);
        ctx.fillText(bossTaunt, iW/2, ty2);
        ctx.restore();
      }
    }

    if(bossDefeatFlashTimer>0){
      ctx.save();
      ctx.globalAlpha = Math.min(1, bossDefeatFlashTimer*1.2);
      ctx.font = 'bold ' + Math.round(iH*0.07) + 'px monospace';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.lineWidth = 3;
      ctx.strokeStyle = '#1a1a2e';
      ctx.fillStyle = '#ffe066';
      var dy = horizonY()*0.5;
      ctx.strokeText('BOSS DEFEATED!', iW/2, dy);
      ctx.fillText('BOSS DEFEATED!', iW/2, dy);
      ctx.restore();
    }

    if(bossTransformFlash>0){
      ctx.save();
      ctx.fillStyle = 'rgba(180,10,10,'+(Math.min(1,bossTransformFlash)*0.35).toFixed(2)+')';
      ctx.fillRect(0,0,iW,iH);
      if(bossImgTransform.complete && bossImgTransform.naturalWidth>0){
        var tfAlpha = Math.min(1, bossTransformFlash*0.9);
        var tfAspect = bossImgTransform.naturalWidth/bossImgTransform.naturalHeight;
        var tfH = iH*0.62, tfW = tfH*tfAspect;
        ctx.globalAlpha = tfAlpha;
        ctx.drawImage(bossImgTransform, Math.round(iW/2-tfW/2), Math.round(horizonY()*0.62-tfH/2), Math.round(tfW), Math.round(tfH));
      }
      ctx.globalAlpha = Math.min(1, bossTransformFlash*1.1);
      ctx.font = 'bold ' + Math.round(iH*0.065) + 'px monospace';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.lineWidth = 3;
      ctx.strokeStyle = '#1a1a2e';
      ctx.fillStyle = '#ff2020';
      var tfy = horizonY()*0.5;
      ctx.strokeText('IT TRANSFORMS!', iW/2, tfy);
      ctx.fillText('IT TRANSFORMS!', iW/2, tfy);
      ctx.restore();
    }

    if(flashAlpha>0){
      ctx.fillStyle = 'rgba(210,225,255,'+flashAlpha.toFixed(2)+')';
      ctx.fillRect(0,0,iW,iH);
    }

    if(hitFlashAlpha>0){
      ctx.fillStyle = 'rgba(228,66,63,'+hitFlashAlpha.toFixed(2)+')';
      ctx.fillRect(0,0,iW,iH);
    }

    if(cutsceneFlashAlpha>0){
      ctx.fillStyle = 'rgba(255,255,255,'+cutsceneFlashAlpha.toFixed(2)+')';
      ctx.fillRect(0,0,iW,iH);
    }

    if(endingActive && endingTimer < 2){
      var whiteout = 1 - Math.max(0,endingTimer)/2;
      ctx.fillStyle = 'rgba(255,250,235,'+(whiteout*0.9).toFixed(2)+')';
      ctx.fillRect(0,0,iW,iH);
    }
  }

  // ---------- Loop ----------
  var lastTime = null;
  function loop(ts){
    if(lastTime===null) lastTime = ts;
    var dt = (ts-lastTime)/1000;
    lastTime = ts;
    dt = Math.min(dt, 0.05);
    cloudT += dt;
    if(cutsceneFlashAlpha>0){
      cutsceneFlashAlpha -= dt*3.5;
      if(cutsceneFlashAlpha<0) cutsceneFlashAlpha=0;
    }
    update(dt);
    render();
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);

})();
</script>
</body>
</html>
